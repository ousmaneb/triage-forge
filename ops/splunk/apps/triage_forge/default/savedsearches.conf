# Fires once per matching event and posts it to the triage API.
# The demo script indexes events with sourcetype triage_forge:demo.
[Triage Forge - Demo Detections]
search = index=main sourcetype="triage_forge:demo" | table _time host user Image ParentImage CommandLine signature src_ip dest_ip failure_count bytes_out dc_dest dest_priority user_priority geo_mismatch
cron_schedule = * * * * *
dispatch.earliest_time = -2m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.digest_mode = 0
alert.suppress = 0
action.webhook = 1
action.webhook.param.url = http://api:8080/webhooks/splunk?token=change-me
